name: Publish Package to npmjs
on:
  release:
    types: [published]
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24.x'
          registry-url: 'https://registry.npmjs.org'

      - run: npm ci

      # Notice the env block is completely gone!
      - name: Publish to npm (Auto-detect prerelease)
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [[ "$VERSION" == *"-"* ]]; then
            echo "Prerelease detected ($VERSION). Publishing to 'next' tag..."
            npm publish --provenance --access public --tag next
          else
            echo "Stable release detected ($VERSION). Publishing to 'latest' tag..."
            npm publish --provenance --access public
          fi